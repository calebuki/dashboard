name: Build desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      MAIN_VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      MAIN_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: |
            release/Dashboard-Setup-*.exe
            release/Dashboard-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      MAIN_VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      MAIN_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:mac
      - name: Validate signing when configured
        if: ${{ env.CSC_LINK != '' }}
        run: codesign --verify --deep --strict --verbose=2 release/mac-universal/Dashboard.app
      - uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: |
            release/Dashboard-*-mac-universal.dmg
            release/Dashboard-*-mac-universal.dmg.blockmap
            release/Dashboard-*-mac-universal.zip
            release/Dashboard-*-mac-universal.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "Dashboard $GITHUB_REF_NAME"
