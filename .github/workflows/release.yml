name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer
        run: npm run build:win

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem -LiteralPath release -Filter 'Dashboard-Setup-*.exe' -File).FullName
            (Get-ChildItem -LiteralPath release -Filter 'Dashboard-Setup-*.exe.blockmap' -File).FullName
            (Resolve-Path -LiteralPath 'release/latest.yml').Path
          )
          if ($assets.Count -ne 3) { throw "Expected exactly three release assets, found $($assets.Count)." }
          gh release create $env:GITHUB_REF_NAME $assets --generate-notes --title "Dashboard $env:GITHUB_REF_NAME"
